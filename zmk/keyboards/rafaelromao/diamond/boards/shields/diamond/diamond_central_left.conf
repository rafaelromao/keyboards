CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_POINTING=y

# Deep sleep is a reboot: activity.c calls sys_poweroff(), and ZMK keeps no
# layer state across a restart, so the ALT_OS toggle would quietly fall back to
# Linux after an hour idle. Only the central holds layer state, so only this
# side stays awake -- the peripherals still deep sleep.
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_HID_INDICATORS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
