CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keep battery and connectivity information, without refreshing on layer changes.
CONFIG_CUSTOM_WIDGET_LAYER_STATUS=n

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
