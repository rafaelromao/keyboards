# The left half is a peripheral of the dongle here, not the central it is on
# its own. ZMK loads <board dir>.conf (corneish_zen.conf) and then this
# <board>.conf; the old corneish_zen_v2_* names matched nothing.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_USB=n
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_CUSTOM_WIDGET_OUTPUT_STATUS=n
CONFIG_CUSTOM_WIDGET_LAYER_STATUS=n
CONFIG_CUSTOM_WIDGET_PERIPHERAL_STATUS=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
