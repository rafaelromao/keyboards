CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_POINTING=y

# No sleep settings here: this file is also loaded for the dongle shield (ZMK
# matches it as a prefix of corneish_zen_dongle), after the dongle's own conf,
# and it used to switch the dongle's ZMK_SLEEP=n back on. The halves set
# their sleep in corneish_zen_{left,right}.conf.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_HID_INDICATORS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
