CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_MOUSE=y

# Deep sleep is a reboot, and a restart loses the ALT_OS toggle along with the
# rest of the layer state. A dongle on USB never reaches deep sleep anyway
# (activity.c guards on USB power); this just says so.
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_BT_BAS=n

CONFIG_ZMK_HID_INDICATORS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# OS detection (os.dtsi) now sets ALT_OS on connect, so the per-endpoint replay
# is redundant. The node stays in persist.dtsi; only the driver is off.
CONFIG_ZMK_PERSISTENT_LAYERS=n
