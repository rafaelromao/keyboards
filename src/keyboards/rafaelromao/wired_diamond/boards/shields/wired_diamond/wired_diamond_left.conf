CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_MOUSE=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_ZMK_HID_INDICATORS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# zmk-layer-hud: room for the layer announcement (usages + commit) next to held keys
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=12

# zmk-persistent-layers: keep the alt OS mode across a replug.
#
# ZMK only implies SETTINGS for BLE builds, and this board is USB-only, so the
# save and load compiled out and the mode was forgotten on every restart. The
# xiao_rp2040 defconfig already sets the whole NVS backend (CONFIG_NVS,
# CONFIG_SETTINGS_NVS, CONFIG_FLASH, CONFIG_FLASH_MAP) and the board defines a
# storage_partition, so this is the only switch that was missing -- turning it
# on also silences the "SETTINGS_NVS was selected but no symbol ended up as the
# choice selection" warning, which was that half-configuration showing through.
#
# Unverified on hardware: the board marks storage_partition read-only. If NVS
# refuses to mount, the mode simply stops persisting again and the partition
# needs overriding in wired_diamond_left.overlay.
CONFIG_SETTINGS=y
