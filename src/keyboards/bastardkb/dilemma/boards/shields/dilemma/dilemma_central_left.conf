CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_MOUSE=y

# Deep sleep is a reboot: activity.c calls sys_poweroff(), and ZMK keeps no
# layer state across a restart, so the ALT_OS toggle would quietly fall back to
# the build's default OS after an hour idle. Only the central holds layer state,
# so only this side stays awake -- the peripherals still deep sleep.
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

CONFIG_I2C=y
CONFIG_ZMK_POINTING=y

# Disable usb if the Left side is peripheral, comment otherwise
# CONFIG_ZMK_USB=n

# Logs if the Left side is central, comment otherwise
# CONFIG_INPUT_LOG_LEVEL_DBG=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_BT_BAS=n

CONFIG_ZMK_HID_INDICATORS=y

CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

CONFIG_LV_Z_VDB_SIZE=32

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# OS detection (os.dtsi) now sets ALT_OS on connect, so the per-endpoint replay
# is redundant. The node stays in persist.dtsi; only the driver is off.
CONFIG_ZMK_PERSISTENT_LAYERS=n
