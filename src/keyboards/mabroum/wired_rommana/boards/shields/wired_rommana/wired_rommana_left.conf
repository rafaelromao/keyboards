CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10
CONFIG_ZMK_MOUSE=y

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_ZMK_HID_INDICATORS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# zmk-layer-hud: room for the layer announcement (usages + commit) next to held keys
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=12
