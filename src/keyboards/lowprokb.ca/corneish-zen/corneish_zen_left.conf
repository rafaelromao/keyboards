# Central-only overrides for the dongleless Zen.
#
# Both halves share corneish_zen.conf, because that is the board *directory*
# name; post_boards_shields.cmake also looks for <board>.conf and appends every
# candidate it finds, later files winning, so this one reaches the left half
# alone.
#
# Deep sleep is a reboot: activity.c calls sys_poweroff(), and ZMK keeps no
# layer state across a restart, so the ALT_OS toggle would quietly fall back to
# the build's default OS after an hour idle. The left half is the central and
# the only side holding layer state; the right half still deep sleeps.
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# OS detection (os.dtsi) now sets ALT_OS on connect, so the per-endpoint replay
# is redundant. The node stays in persist.dtsi; only the driver is off.
CONFIG_ZMK_PERSISTENT_LAYERS=n
