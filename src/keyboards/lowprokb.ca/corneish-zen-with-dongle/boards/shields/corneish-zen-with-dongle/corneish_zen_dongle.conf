CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# OS detection (os.dtsi) now sets ALT_OS on connect, so the per-endpoint replay
# is redundant. The node stays in persist.dtsi; only the driver is off.
CONFIG_ZMK_PERSISTENT_LAYERS=n
